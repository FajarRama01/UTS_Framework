<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Belajar - MiniLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Agar sidebar full height dan bisa discroll sendiri */
        .sidebar-materi {
            height: calc(100vh - 70px);
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }
        .materi-active {
            background-color: #e9ecef;
            border-left: 4px solid #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-white">
    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top" style="height: 60px;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-6" href="kelas_saya.html">
                <i class="bi bi-chevron-left"></i> Kembali ke Kelas Saya
            </a>
            <span class="navbar-text text-white fw-bold" id="judulKelasTop">Memuat Kelas...</span>
            <div></div> </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-light sidebar-materi p-0">
                <div class="p-3 border-bottom bg-white">
                    <h6 class="fw-bold mb-0">Daftar Materi</h6>
                </div>
                <div class="list-group list-group-flush" id="sidebarList">
                    <div class="text-center p-3"><div class="spinner-border spinner-border-sm"></div></div>
                </div>
            </div>

            <div class="col-md-9 p-5" style="height: calc(100vh - 70px); overflow-y: auto;">
                <div id="kontenArea" style="max-width: 800px; margin: 0 auto;">
                    </div>

                <div class="d-flex justify-content-between mt-5 pt-5 border-top" style="max-width: 800px; margin: 0 auto;">
                    <button id="btnPrev" class="btn btn-outline-secondary px-4" disabled>
                        <i class="bi bi-arrow-left"></i> Sebelumnya
                    </button>
                    <button id="btnNext" class="btn btn-primary px-4">
                        Selanjutnya <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        checkAuth();
        // Ambil parameter URL: ?kelas=1&materi=5
        const urlParams = new URLSearchParams(window.location.search);
        const kelasId = urlParams.get('kelas');
        
        if(kelasId) {
            loadHalamanBelajar(kelasId);
        } else {
            window.location.href = 'kelas_saya.html';
        }
    </script>
</body>
</html>
