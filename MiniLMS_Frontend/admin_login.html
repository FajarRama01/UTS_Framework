<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MiniLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529; /* Background Hitam */
            height: 100vh;
            display: flex;
            align_items: center;
            justify_content: center;
        }
        .card {
            border: 1px solid #495057;
            background-color: #343a40; /* Card Abu Gelap */
            color: white;
        }
        .form-control {
            background-color: #495057;
            border-color: #6c757d;
            color: white;
        }
        .form-control:focus {
            background-color: #495057;
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-5 shadow-lg">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-uppercase ls-2"><i class="bi bi-shield-lock"></i> Admin Portal</h4>
                        <small class="text-white-50">Hanya untuk staf pengajar</small>
                    </div>
                    
                    <div id="alertMessage"></div>

                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Admin username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Masuk Dashboard</button>
                    </form>
                    
                    <div class="text-center mt-4 border-top border-secondary pt-3">
                        <a href="login.html" class="text-decoration-none text-white-50 small">
                            <i class="bi bi-arrow-left"></i> Kembali ke Login Siswa
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        // Panggil fungsi login KHUSUS ADMIN
        document.getElementById('adminLoginForm').addEventListener('submit', handleAdminLogin);
    </script>
</body>
</html>
