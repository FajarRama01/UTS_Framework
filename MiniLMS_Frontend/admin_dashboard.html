<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MiniLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            color: white;
        }
        .nav-link { color: rgba(255,255,255,.75); cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: white; background-color: rgba(255,255,255,.1); }
        /* Utility untuk Hide/Show Section */
        .d-none { display: none !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-3">
                <h4 class="fw-bold mb-4 text-center text-uppercase ls-2"><i class="bi bi-shield-lock"></i> Admin</h4>
                <div class="d-grid gap-2 mb-4">
                    <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-eye"></i> Lihat Web Siswa</a>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link active" id="menuKelas" onclick="switchMenu('kelas')">
                            <i class="bi bi-journal-bookmark me-2"></i> Manajemen Kelas
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" id="menuInstruktur" onclick="switchMenu('instruktur')">
                            <i class="bi bi-person-badge me-2"></i> Instruktur
                        </a>
                    </li>
                    <li class="nav-item mt-5">
                        <!-- <a class="nav-link text-danger" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-left me-2"></i> Logout
                        </a> -->
                        <a class="nav-link text-danger" href="#" onclick="logoutAdmin()"> 
                            <i class="bi bi-box-arrow-left me-2"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>

            <div class="col-md-10 p-4">
                <div id="adminAlert"></div>

                <div id="section-kelas">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold">Daftar Kelas</h2>
                        <button class="btn btn-primary" onclick="openModalKelas()">
                            <i class="bi bi-plus-lg"></i> Tambah Kelas
                        </button>
                    </div>
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Judul Kelas</th>
                                        <th>Level</th>
                                        <th>Mulai</th>
                                        <th>Instruktur</th>
                                        <th class="text-end pe-4">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBodyKelas"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="section-instruktur" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold">Data Instruktur</h2>
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalInstruktur">
                            <i class="bi bi-person-plus-fill"></i> Tambah Instruktur
                        </button>
                    </div>
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Nama Lengkap</th>
                                        <th>Email</th>
                                        <th>Keahlian</th>
                                        <th class="text-end pe-4">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBodyInstruktur"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalKelas" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalKelasTitle">Form Kelas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formKelas">
                        <input type="hidden" id="kelasId">
                        
                        <div class="mb-3">
                            <label class="form-label">Judul Kelas</label>
                            <input type="text" id="judul" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi Singkat</label>
                            <textarea id="deskripsi" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tingkat</label>
                                <select id="tingkat" class="form-select">
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tanggal Mulai</label>
                                <input type="date" id="tanggal_mulai" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Instruktur Pengajar</label>
                            <select id="instrukturSelect" class="form-select" required>
                                <option value="">-- Pilih Instruktur --</option>
                                </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="simpanKelas()">Simpan Data</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalInstruktur" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Instruktur Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formInstruktur">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="namaInstruktur" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="emailInstruktur" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Keahlian (Pisahkan koma)</label>
                            <input type="text" id="keahlianInstruktur" class="form-control" placeholder="Contoh: Python, Django, Data Science" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-success" onclick="simpanInstruktur()">Simpan Instruktur</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        checkAdminAuth(); // <-- Ini akan melempar ke admin_login.html
        loadTableKelas();
    </script>
</body>
</html>
