<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MiniLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align_items: center;
            justify_content: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h3 class="text-center mb-4 fw-bold text-primary">MiniLMS Login</h3>
                    <div id="alertMessage"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Masukan username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Masuk Sekarang</button>
                        <div class="text-center mt-4">
                            <small class="text-muted">Belum punya akun? <a href="register.html" class="text-decoration-none fw-bold">Daftar disini</a></small>
                        </div>
                    </form>
                    <p class="text-center mt-3 text-muted small">Project UTS Framework Programming</p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        // Logic khusus Login
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
